name = "uxcommunity-realtime"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Secrets are injected via `wrangler secret put` in production:
#   SESSION_SECRET           — shared with the web app (JWT signing secret)
#   REALTIME_PUBLISH_SECRET  — server-to-server secret for the /publish endpoint
#   API_SECRET               — internal API secret for membership checks

[durable_objects]
bindings = [
  { name = "COMMUNITY_DO", class_name = "Room" },
  { name = "USER_DO", class_name = "UserDO" },
  { name = "ALERT_MONITOR", class_name = "AlertMonitor" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = []

[[migrations]]
tag = "v4"
new_sqlite_classes = ["AlertMonitor"]

# Dependency monitor: every five minutes this Worker asks the web app whether
# R2, Supabase, realtime, Upstash, Resend and GIPHY are reachable, and the web
# app emails the admins when one of the services worth waking someone for goes
# down (see src/alert-monitor.ts and apps/web/lib/health/alert.ts).
#
# Chat retention: every six hours this Worker POSTs the web app's internal
# retention endpoint, which hard-deletes community chat messages older than the
# 15-day window and removes their R2 images (see src/retention.ts and
# apps/web/lib/communities/message-retention-sweep.ts). Six-hourly rather than
# daily so a big first-run backlog drains the same day, and each empty run is a
# single indexed query.
#
# Event lifecycle: every minute this Worker asks the web app which events have
# a reminder due — tomorrow, this morning, in half an hour, live, ended — and
# the web app writes the in-app row and sends the Expo push (see
# src/event-notifications.ts and apps/web/lib/events/lifecycle-notifications.ts).
# Minute-accurate because the moments are clock-accurate; a tick with nothing
# due is a handful of indexed queries.
#
# Cron Triggers are per-Worker and free, which is why all three live here:
# the realtime Worker already runs this app's Durable Objects and already holds
# API_URL / API_SECRET, so this adds no deployment, no secret and no resource
# to provision. The monitor also cannot alert about the web app itself being
# down — the email is sent BY the web app — so that case is logged instead.
[triggers]
crons = ["*/5 * * * *", "0 */6 * * *", "* * * * *"]

# Invocation logs. These used to live in a duplicate config at the repository
# root, which existed only so the Cloudflare Git integration could build from
# there. That integration is disconnected, so this file is the sole source of
# truth for the Worker and has to carry them itself: `wrangler deploy` replaces
# the Worker's configuration wholesale on every deploy, so omitting this block
# here is what silently turns realtime logging off.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
