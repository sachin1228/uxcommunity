name = "uxcommunity-realtime-development"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
APP_ENV = "development"

[durable_objects]
bindings = [
  { name = "COMMUNITY_DO", class_name = "Room" },
  { name = "USER_DO", class_name = "UserDO" },
  { name = "ALERT_MONITOR", class_name = "AlertMonitor" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "UserDO", "AlertMonitor"]

[triggers]
crons = []
