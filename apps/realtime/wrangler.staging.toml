name = "uxcommunity-realtime-staging"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[services]]
binding = "WEB_SERVICE"
service = "uxcommunity-web-staging"

[durable_objects]
bindings = [
  { name = "COMMUNITY_DO", class_name = "Room" },
  { name = "USER_DO", class_name = "UserDO" },
  { name = "ALERT_MONITOR", class_name = "AlertMonitor" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = []

[[migrations]]
tag = "v4"
new_sqlite_classes = ["AlertMonitor"]

[vars]
APP_ENV = "staging"

[triggers]
crons = []
