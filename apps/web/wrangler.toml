# OpenNext-on-Cloudflare config for the web app.
# `main`/`assets` are produced by `opennextjs-cloudflare build` (.open-next/).
name = "uxcommunity-web"
main = ".open-next/worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

# NOTE: keep this line above every [table] header — a bare key that follows a
# table header attaches to that table. Inserting [placement] above this line
# once mis-scoped it into ratelimits.simple and silently stripped the assets
# binding from the deploy (every /_next/static/* 404'd).
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Run the Worker near Supabase, the backend it talks to most.
#
# A community open fires 5–7 sequential PostgREST round trips (read model,
# message page, rules, content events), and every wave paid the full
# colo → Supabase-region round trip: measured at 300–450ms per wave from the
# request's colo, which is the bulk of the 2.4–3.4s bootstrap. Smart Placement
# moves fetch-handler execution to the location closest to the upstream that
# receives the most subrequests (cloudflare docs: "Placement"), which is
# Supabase here. Static assets are always served from the request's own
# location, so page loads do not regress.
[placement]
mode = "smart"

# Burst protection for every page/API request, counted in-location.
#
# global-request-rate-limit.ts keeps the burst window (50 requests / 10s) on
# this binding when it exists: the counters live on the same machine as the
# Worker, so the check adds no network hop — where the Upstash REST limiter it
# falls back to pays a cross-region HTTPS round trip on EVERY page and API
# request. The sustained window (300/60s) stays on Upstash because it must
# count across locations. `period` must be 10 or 60 (Workers Rate Limiting
# API), which is why the burst window is exactly 10s.
# namespace_id must be unique per Cloudflare account; 1201 is reserved for
# this Worker's global burst limiter.
[[ratelimits]]
name = "GLOBAL_REQUEST_BURST_LIMITER"
namespace_id = "1201"

  [ratelimits.simple]
  limit = 50
  period = 10

# Lets the worker self-fetch for `next start` / SSR internals.
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "uxcommunity-web"

# Enables next/image optimization via Cloudflare Images
# (see https://opennext.js.org/cloudflare/howtos/image).
[images]
binding = "IMAGES"

# Backing store for the Next.js data cache (unstable_cache), wired up in
# open-next.config.ts. Without it the feed / lottie / master-data caches only
# live in per-isolate memory, so every cold isolate recomputes the heavy home
# feed RPC (~0.8–1.8s) and re-fetches Lottie payloads from R2 on each sidebar
# load. Create the bucket once before deploying:
#   wrangler r2 bucket create uxcommunity-web-next-cache
#
# NOTE — this is the NEXT.JS INCREMENTAL CACHE bucket, NOT the media bucket.
# Media (images/videos/audio/PDFs/avatars/lottie) lives in a separate bucket
# configured via the R2_BUCKET_NAME / R2_PUBLIC_URL secrets (the S3-compatible
# client in lib/r2.ts). Do not merge the two: this bucket must stay for ISR /
# unstable_cache; media must not be copied into it (no duplicate storage).
[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "uxcommunity-web-next-cache"

# ── Media delivery & edge caching ────────────────────────────────────────────
# Uploaded media is stored in the R2 bucket named by the R2_BUCKET_NAME secret
# and served from R2_PUBLIC_URL. All uploads are tagged
# `Cache-Control: public, max-age=31536000, immutable` (keys are versioned), so
# Cloudflare's CDN edge caches them. For the edge cache to actually engage,
# R2_PUBLIC_URL MUST be a custom domain attached to the bucket in the Cloudflare
# dashboard (e.g. https://media.uxcommunity.in), NOT the pub-*.r2.dev dev URL —
# r2.dev responses bypass the CDN edge cache. R2 stays the origin/source of
# truth; no extra cache bucket or Cache Reserve is used.

# Non-secret, public-by-design values used at runtime by server code.
# Secrets (SESSION_SECRET, SUPABASE_SERVICE_ROLE_KEY, REALTIME_URL,
# REALTIME_PUBLISH_SECRET, API_SECRET, UPSTASH_REDIS_REST_URL/TOKEN,
# RESEND_API_KEY, EMAIL_FROM, GIPHY_API_KEY, R2_*, ADMIN_EMAIL/PASSWORD) are
# pushed onto the Worker by the deploy workflow's "Set web worker secrets"
# step — `wrangler secret bulk` from the GitHub Actions secrets on every
# deploy. `wrangler deploy` never uploads .dev.vars, and a bulk push never
# deletes secrets it does not mention: a hand-set secret whose name is not in
# the repository survives deploys.
[vars]
NEXT_PUBLIC_APP_URL = "https://app.uxcommunity.in"
# Only the project URL is public now: the app reaches Supabase exclusively
# through the server-side service-role client, so it never ships an anon key.
NEXT_PUBLIC_SUPABASE_URL = "https://eauupthwlnarkauwifmw.supabase.co"
NEXT_PUBLIC_REALTIME_URL = "https://rt.uxcommunity.in"