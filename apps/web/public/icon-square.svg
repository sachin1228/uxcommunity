<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256"
     viewBox="0 0 256 256"
     fill="none"
     role="img"
     aria-label="uxcommunity">

  <defs>
    <linearGradient id="uxc-bg" x1="128" y1="0" x2="128" y2="256"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#30323A"/>
      <stop offset="38%" stop-color="#24262D"/>
      <stop offset="100%" stop-color="#1D1F26"/>
