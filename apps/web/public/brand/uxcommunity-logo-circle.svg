<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256"
     viewBox="0 0 256 256"
     fill="none"
     role="img"
     aria-label="uxcommunity">

  <defs>
    <linearGradient id="uxc-bg" x1="128" y1="0" x2="128" y2="256"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#30323A"/>
      <stop offset="38%" stop-color="#24262D"/>
      <stop offset="100%" stop-color="#1D1F26"/>
    </linearGradient>

    <radialGradient id="uxc-gloss" cx="0" cy="0" r="1"
                    gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(105 15) rotate(70) scale(210 180)">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="uxc-depth" x1="128" y1="110" x2="128" y2="256"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>

    <clipPath id="uxc-clip">
      <circle cx="128" cy="128" r="128"/>
    </clipPath>
  </defs>

  <g clip-path="url(#uxc-clip)">
    <rect width="256" height="256" fill="url(#uxc-bg)"/>
    <rect width="256" height="256" fill="url(#uxc-gloss)"/>
    <rect width="256" height="256" fill="url(#uxc-depth)"/>
  </g>

  <!-- Larger centered speech bubble -->
  <g transform="translate(49 49) scale(6.6)" fill="#FFFFFF">
    <path d="M16 4H8a7 7 0 0 0 0 14h4v4l8.16-5.39A6.78 6.78 0 0 0 23 11a7 7 0 0 0-7-7
             M8 12.25A1.25 1.25 0 1 1 9.25 11 1.25 1.25 0 0 1 8 12.25
             m4 0A1.25 1.25 0 1 1 13.25 11 1.25 1.25 0 0 1 12 12.25
             m4 0A1.25 1.25 0 1 1 17.25 11 1.25 1.25 0 0 1 16 12.25"/>
  </g>
</svg>
