<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle District</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
  // Freebuff integration: seed the player name from the app (e.g. /game/index.html?name=alex).
  // Only fills the slot when the player has not chosen a name themselves yet.
  try {
    var fromApp = new URLSearchParams(location.search).get('name');
    if (fromApp && !localStorage.getItem('doodle_name')) {
      localStorage.setItem('doodle_name', fromApp.slice(0, 14));
    }
  } catch (e) { /* ignore */ }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
