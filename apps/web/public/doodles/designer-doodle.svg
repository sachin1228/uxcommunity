<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="480" viewBox="0 0 480 480" fill="none">
  <!-- uxcommunity chat doodle — designer/UX motifs, stroke line art.
       Drawn once per icon in <defs>, scattered twice across a seamless 480 tile.
       Rendered color comes from the CSS layer (mask-image), so strokes stay #000. -->
  <defs>
    <!-- pen tool nib -->
    <g id="d-pen">
      <path d="M0 14 L-8 -6 L-8 -10 L8 -10 L8 -6 Z"/>
      <circle cx="0" cy="-3.5" r="2.6"/>
      <path d="M0 -0.9 L0 13"/>
    </g>
    <!-- bezier curve with anchors + handles -->
    <g id="d-bezier">
      <path d="M-17 8 C-9 -14 9 22 17 -6"/>
      <path d="M-17 8 L-9 -14"/>
      <path d="M17 -6 L9 22"/>
      <circle cx="-9" cy="-14" r="2.2"/>
      <circle cx="9" cy="22" r="2.2"/>
      <rect x="-19.5" y="5.5" width="5" height="5"/>
      <rect x="14.5" y="-8.5" width="5" height="5"/>
    </g>
    <!-- artboard with crop ticks -->
    <g id="d-artboard">
      <rect x="-13" y="-15" width="26" height="30" rx="1.5"/>
      <path d="M-13 -19 V-15 M-17 -15 H-13 M13 -19 V-15 M13 -15 H17 M-13 15 V19 M-17 15 H-13 M13 15 V19 M13 15 H17"/>
    </g>
    <!-- paint palette -->
    <g id="d-palette">
      <circle cx="0" cy="0" r="12"/>
      <circle cx="4.5" cy="4.5" r="3"/>
      <circle cx="-5.5" cy="-4.5" r="1.7"/>
      <circle cx="0.5" cy="-7" r="1.7"/>
      <circle cx="6" cy="-2.5" r="1.7"/>
    </g>
    <!-- paintbrush -->
    <g id="d-brush">
      <path d="M-13 -13 L0 0"/>
      <path d="M0 0 L4 4" stroke-width="4"/>
      <path d="M4 4 C6.5 4.5 10 8 12.5 12.5 C14 15 11.5 16.5 9.8 14.8 C6 12 4.5 8 4 4 Z"/>
    </g>
    <!-- pencil -->
    <g id="d-pencil">
      <path d="M-11 11 L5 -5 L9 -1 L-7 15 Z"/>
      <path d="M-11 11 L-15 15 L-7 15 Z"/>
      <path d="M3 -3 L7 1"/>
    </g>
    <!-- cursor with click sparks -->
    <g id="d-cursor">
      <path d="M0 0 L0 15 L4.5 11.2 L7.3 17.2 L10.3 15.7 L7.6 9.8 L13 9.4 Z"/>
      <path d="M0 -3.5 L0 -6.5"/>
      <path d="M-3.5 0 L-6.5 0"/>
      <path d="M-2.5 -2.5 L-5 -5"/>
    </g>
    <!-- eyedropper -->
    <g id="d-dropper">
      <circle cx="8.5" cy="-8.5" r="3.2"/>
      <path d="M-2 2 L6 -6"/>
      <path d="M6 -6 L10 -2"/>
      <path d="M10 -2 L4 4"/>
      <path d="M-2 2 L-13 13 L4 4"/>
    </g>
    <!-- type Aa -->
    <g id="d-type">
      <path d="M-14 9 L-8 -9 L-2 9"/>
      <path d="M-11.5 3 L-4.5 3"/>
      <circle cx="6.5" cy="4" r="4.6"/>
      <path d="M11.1 -1 L11.1 9.5"/>
    </g>
    <!-- canvas grid with anchor nodes -->
    <g id="d-grid">
      <rect x="-13" y="-13" width="26" height="26" rx="2"/>
      <path d="M-13 -4 H13"/>
      <path d="M5 -13 V13"/>
      <rect x="2.5" y="-6.5" width="5" height="5"/>
      <rect x="2.5" y="2.5" width="5" height="5"/>
    </g>
    <!-- ruler -->
    <g id="d-ruler">
      <rect x="-14" y="-5" width="28" height="10" rx="1"/>
      <path d="M-10 -5 V0 M-6 -5 V-1 M-2 -5 V0 M2 -5 V-1 M6 -5 V0 M10 -5 V-1"/>
    </g>
    <!-- layer stack -->
    <g id="d-layers">
      <path d="M-12 -10 L0 -15.5 L12 -10 L0 -4.5 Z"/>
      <path d="M-12 -1 L0 -6.5 L12 -1 L0 4.5 Z"/>
      <path d="M-12 8 L0 2.5 L12 8 L0 13.5 Z"/>
    </g>
    <!-- sticky note -->
    <g id="d-sticky">
      <path d="M-10 -12 H6 L12 -6 V10 C12 11.1 11.1 12 10 12 H-10 C-11.1 12 -12 11.1 -12 10 V-10 C-12 -11.1 -11.1 -12 -10 -12 Z"/>
      <path d="M6 -12 V-6 H12"/>
      <path d="M-6 -2 H6"/>
      <path d="M-6 3 H2"/>
    </g>
    <!-- idea bulb -->
    <g id="d-bulb">
      <circle cx="0" cy="-4" r="7.5"/>
      <path d="M-3 3.2 V7 M3 3.2 V7"/>
      <path d="M-3 7 H3"/>
      <path d="M-2.2 9.5 H2.2"/>
      <path d="M0 -16 V-13.5"/>
      <path d="M-9.5 -12.5 L-7.8 -11"/>
      <path d="M9.5 -12.5 L7.8 -11"/>
    </g>
    <!-- smiley -->
    <g id="d-smiley">
      <circle cx="0" cy="0" r="11"/>
      <path d="M-4 -3.5 V-2.5"/>
      <path d="M4 -3.5 V-2.5"/>
      <path d="M-4.5 3.5 C-2.5 6.8 2.5 6.8 4.5 3.5"/>
    </g>
    <!-- chat bubble (the brand mark) -->
    <g id="d-bubble">
      <path d="M-10 -8.5 H9 C10.7 -8.5 12 -7.2 12 -5.5 V4.5 C12 6.2 10.7 7.5 9 7.5 H-4.5 L-10 12.5 L-9.2 7.5 H-10 C-11.7 7.5 -13 6.2 -13 4.5 V-5.5 C-13 -7.2 -11.7 -8.5 -10 -8.5 Z"/>
      <path d="M-7.5 -0.5 V0.5 M-2.5 -0.5 V0.5 M2.5 -0.5 V0.5"/>
    </g>
    <!-- rocket -->
    <g id="d-rocket">
      <path d="M0 -14 C5 -9 6.5 -2 4.5 6 H-4.5 C-6.5 -2 -5 -9 0 -14 Z"/>
      <circle cx="0" cy="-4" r="2.6"/>
      <path d="M-4.5 0.5 C-8.5 2.5 -9.5 5.5 -8.5 8.5 L-4.5 5"/>
      <path d="M4.5 0.5 C8.5 2.5 9.5 5.5 8.5 8.5 L4.5 5"/>
      <path d="M0 8.5 C-2 10.5 2 12 0 14.5"/>
    </g>
    <!-- heart -->
    <g id="d-heart">
      <path d="M0 10.5 C-2.5 10.5 -9 6 -11.5 0.5 C-13.5 -4 -10.5 -9.5 -6 -9.5 C-3 -9.5 -1 -7.5 0 -5.5 C1 -7.5 3 -9.5 6 -9.5 C10.5 -9.5 13.5 -4 11.5 0.5 C9 6 2.5 10.5 0 10.5 Z"/>
    </g>
    <!-- four-point sparkle -->
    <g id="d-sparkle">
      <path d="M0 -12 C0.8 -4.5 4.5 -0.8 12 0 C4.5 0.8 0.8 4.5 0 12 C-0.8 4.5 -4.5 0.8 -12 0 C-4.5 -0.8 -0.8 -4.5 0 -12 Z"/>
    </g>
    <!-- component diamond -->
    <g id="d-component">
      <path d="M0 -11 L11 0 L0 11 L-11 0 Z"/>
      <circle cx="0" cy="-14.8" r="1.6"/>
      <circle cx="14.8" cy="0" r="1.6"/>
      <circle cx="0" cy="14.8" r="1.6"/>
      <circle cx="-14.8" cy="0" r="1.6"/>
    </g>
    <!-- gradient bar with handles -->
    <g id="d-gradient">
      <rect x="-13" y="-7" width="26" height="14" rx="3"/>
      <path d="M-8 3.5 L8 -3.5"/>
      <circle cx="-17" cy="0" r="2.4"/>
      <circle cx="17" cy="0" r="2.4"/>
    </g>
    <!-- wireframe phone -->
    <g id="d-wireframe">
      <rect x="-8" y="-13" width="16" height="26" rx="3"/>
      <path d="M-8 -6 H8"/>
      <path d="M-4.5 0 H4.5"/>
      <path d="M-4.5 4 H1"/>
      <path d="M-3 9.5 H3"/>
    </g>
    <!-- user flow nodes -->
    <g id="d-flow">
      <circle cx="-10" cy="-6.5" r="2.6"/>
      <circle cx="10.5" cy="6" r="2.6"/>
      <path d="M-7.2 -6.8 C0 -9.5 3.5 -1 7 3.8"/>
      <path d="M7 3.8 L4.2 2.8"/>
      <path d="M7 3.8 L6.2 0.8"/>
    </g>
    <!-- inspect eye -->
    <g id="d-eye">
      <path d="M-13 0 C-7 -9 7 -9 13 0 C7 9 -7 9 -13 0 Z"/>
      <circle cx="0" cy="0" r="3.4"/>
    </g>
  </defs>
  <g stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <use href="#d-pen" xlink:href="#d-pen" transform="translate(34 42) rotate(-8)"/>
    <use href="#d-bubble" xlink:href="#d-bubble" transform="translate(103 32) rotate(10)"/>
    <use href="#d-artboard" xlink:href="#d-artboard" transform="translate(171 46) rotate(6)"/>
    <use href="#d-smiley" xlink:href="#d-smiley" transform="translate(240 34) rotate(-10)"/>
    <use href="#d-pencil" xlink:href="#d-pencil" transform="translate(309 44) rotate(12)"/>
    <use href="#d-palette" xlink:href="#d-palette" transform="translate(377 30) rotate(-6)"/>
    <use href="#d-bulb" xlink:href="#d-bulb" transform="translate(446 48) rotate(8)"/>
    <use href="#d-bezier" xlink:href="#d-bezier" transform="translate(68 110) rotate(10)"/>
    <use href="#d-rocket" xlink:href="#d-rocket" transform="translate(137 98) rotate(-12)"/>
    <use href="#d-gradient" xlink:href="#d-gradient" transform="translate(205 108) rotate(8)"/>
    <use href="#d-sticky" xlink:href="#d-sticky" transform="translate(274 100) rotate(-6)"/>
    <use href="#d-eye" xlink:href="#d-eye" transform="translate(343 112) rotate(10)"/>
    <use href="#d-ruler" xlink:href="#d-ruler" transform="translate(411 102) rotate(-10)"/>
    <use href="#d-sparkle" xlink:href="#d-sparkle" transform="translate(16 106) rotate(8)"/>
    <use href="#d-layers" xlink:href="#d-layers" transform="translate(34 180) rotate(-8)"/>
    <use href="#d-cursor" xlink:href="#d-cursor" transform="translate(103 168) rotate(12)"/>
    <use href="#d-flow" xlink:href="#d-flow" transform="translate(171 180) rotate(-10)"/>
    <use href="#d-heart" xlink:href="#d-heart" transform="translate(240 166) rotate(8)"/>
    <use href="#d-component" xlink:href="#d-component" transform="translate(309 180) rotate(-12)"/>
    <use href="#d-brush" xlink:href="#d-brush" transform="translate(377 170) rotate(10)"/>
    <use href="#d-wireframe" xlink:href="#d-wireframe" transform="translate(446 180) rotate(-8)"/>
    <use href="#d-palette" xlink:href="#d-palette" transform="translate(68 242) rotate(10)"/>
    <use href="#d-pen" xlink:href="#d-pen" transform="translate(137 250) rotate(-6)"/>
    <use href="#d-type" xlink:href="#d-type" transform="translate(205 244) rotate(-12)"/>
    <use href="#d-grid" xlink:href="#d-grid" transform="translate(274 248) rotate(6)"/>
    <use href="#d-brush" xlink:href="#d-brush" transform="translate(343 240) rotate(10)"/>
    <use href="#d-sticky" xlink:href="#d-sticky" transform="translate(411 252) rotate(-8)"/>
    <use href="#d-smiley" xlink:href="#d-smiley" transform="translate(16 244) rotate(-8)"/>
    <use href="#d-eye" xlink:href="#d-eye" transform="translate(34 308) rotate(-10)"/>
    <use href="#d-layers" xlink:href="#d-layers" transform="translate(103 316) rotate(8)"/>
    <use href="#d-bulb" xlink:href="#d-bulb" transform="translate(171 306) rotate(12)"/>
    <use href="#d-component" xlink:href="#d-component" transform="translate(240 314) rotate(-6)"/>
    <use href="#d-ruler" xlink:href="#d-ruler" transform="translate(309 308) rotate(10)"/>
    <use href="#d-artboard" xlink:href="#d-artboard" transform="translate(377 318) rotate(-12)"/>
    <use href="#d-bubble" xlink:href="#d-bubble" transform="translate(446 306) rotate(8)"/>
    <use href="#d-pencil" xlink:href="#d-pencil" transform="translate(68 386) rotate(10)"/>
    <use href="#d-heart" xlink:href="#d-heart" transform="translate(137 378) rotate(-8)"/>
    <use href="#d-bezier" xlink:href="#d-bezier" transform="translate(205 388) rotate(-12)"/>
    <use href="#d-cursor" xlink:href="#d-cursor" transform="translate(274 380) rotate(6)"/>
    <use href="#d-wireframe" xlink:href="#d-wireframe" transform="translate(343 388) rotate(-10)"/>
    <use href="#d-dropper" xlink:href="#d-dropper" transform="translate(411 380) rotate(-6)"/>
    <use href="#d-bulb" xlink:href="#d-bulb" transform="translate(16 382) rotate(6)"/>
    <use href="#d-grid" xlink:href="#d-grid" transform="translate(34 446) rotate(8)"/>
    <use href="#d-sparkle" xlink:href="#d-sparkle" transform="translate(103 452) rotate(-10)"/>
    <use href="#d-rocket" xlink:href="#d-rocket" transform="translate(171 446) rotate(12)"/>
    <use href="#d-pen" xlink:href="#d-pen" transform="translate(240 452) rotate(10)"/>
    <use href="#d-flow" xlink:href="#d-flow" transform="translate(309 446) rotate(-12)"/>
    <use href="#d-gradient" xlink:href="#d-gradient" transform="translate(377 452) rotate(8)"/>
    <use href="#d-type" xlink:href="#d-type" transform="translate(446 446) rotate(-8)"/>
  </g>
</svg>
