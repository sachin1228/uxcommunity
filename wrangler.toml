# Root-level configuration for Cloudflare builds that run `npx wrangler deploy`
# from the monorepo root. Keep bindings and migrations aligned with
# apps/realtime/wrangler.toml — this is the canonical realtime config.
# Deploy the separate web Worker through the apps/web workspace.
name = "uxcommunity-realtime"
main = "apps/realtime/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[durable_objects]
bindings = [
  { name = "COMMUNITY_DO", class_name = "Room" },
  { name = "USER_DO", class_name = "UserDO" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = []
