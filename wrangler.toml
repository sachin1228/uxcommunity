# Root-level configuration for Cloudflare builds that run `npx wrangler deploy`
# from the monorepo root. This Worker owns the Room Durable Object; keep its
# binding and migration aligned with apps/realtime/wrangler.toml.
# Deploy the separate web Worker through the apps/web workspace.
name = "uxcommunity-realtime"
main = "apps/realtime/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[durable_objects]
bindings = [{ name = "ROOM", class_name = "Room" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
