name: Deploy to Cloudflare

# Deploys the web worker (uxcommunity-web) and realtime worker
# (uxcommunity-realtime) on every push to main. Mirrors the manual flow:
#
#   cd apps/web && npm run deploy
#   cd apps/realtime && npx wrangler deploy
#
# Secrets are read from GitHub Actions secrets (Settings → Secrets and
# variables → Actions) and written into .dev.vars, which
# `opennextjs-cloudflare deploy` uploads as Worker secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # wrangler 4.x requires Node >= 22, so use 22 (LTS) even though the
      # app itself builds fine on Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets are set
        shell: bash
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
            SESSION_SECRET SUPABASE_SERVICE_ROLE_KEY \
            REALTIME_URL REALTIME_PUBLISH_SECRET \
            API_URL API_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REALTIME_URL: ${{ secrets.REALTIME_URL }}
          REALTIME_PUBLISH_SECRET: ${{ secrets.REALTIME_PUBLISH_SECRET }}
          API_URL: ${{ secrets.API_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}

      # ── Realtime worker (the web app publishes to it) ─────────────────────
      - name: Deploy realtime worker
        working-directory: apps/realtime
        run: npx wrangler deploy

      # Set AFTER the deploy, and never from the dashboard: `wrangler deploy`
      # replaces dashboard-managed vars and secrets with the ones in the config
      # file, so a value added by hand in the Cloudflare UI disappears on the
      # next merge. Anything the Worker needs at runtime has to be pushed here.
      #
      # API_URL / API_SECRET are the membership check's configuration. The
      # realtime Worker FAILS CLOSED without them (audit M-8): with API_URL
      # missing or unreachable, or API_SECRET not matching the web app's, every
      # community socket is refused rather than silently let in. They are
      # therefore verified above and pushed here on every deploy, and API_SECRET
      # is written into the web Worker's .dev.vars below from the same GitHub
      # secret, so the two Workers cannot drift apart.
      - name: Set realtime worker secrets
        working-directory: apps/realtime
        run: |
          echo "${{ secrets.SESSION_SECRET }}" | npx wrangler versions secret put SESSION_SECRET
          echo "${{ secrets.REALTIME_PUBLISH_SECRET }}" | npx wrangler versions secret put REALTIME_PUBLISH_SECRET
          echo "${{ secrets.API_URL }}" | npx wrangler versions secret put API_URL
          echo "${{ secrets.API_SECRET }}" | npx wrangler versions secret put API_SECRET

      # ── Web worker ─────────────────────────────────────────────────────────
      - name: Write build + runtime env files
        working-directory: apps/web
        run: |
          # Build-time env. NEXT_PUBLIC_* vars are INLINED into the client
          # bundle by `next build`, so they must be present in the build
          # environment — wrangler.toml [vars] only reach the worker at
          # runtime (server-side), never the client JS. Mirror them from
          # wrangler.toml into .env.production.local so the client bundle
          # (app URL, realtime WebSocket URL, Supabase project URL) is built
          # with the same values the worker gets at runtime. Supabase is
          # reached only through the server-side service-role client, so
          # there is no anon key to inline.
          cat > .env.production.local <<EOF
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          EOF
          awk '/^\[vars\]/{f=1;next}/^\[/{f=0}f && /^[A-Z_]+ = /{gsub(/^ +/,""); split($0,a," = "); gsub(/"/,"",a[2]); print a[1]"="a[2]}' wrangler.toml >> .env.production.local

          # Runtime secrets → uploaded as Worker secrets by the deploy step.
          # Same values as the local apps/web/.dev.vars.
          cat > .dev.vars <<EOF
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Same value the realtime Worker gets, from the same GitHub secret:
          # the internal membership endpoint only accepts this exact secret.
          API_SECRET=${{ secrets.API_SECRET }}
          REALTIME_URL=${{ secrets.REALTIME_URL }}
          REALTIME_PUBLISH_SECRET=${{ secrets.REALTIME_PUBLISH_SECRET }}
          UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          INVITATION_EXPIRY_DAYS=${{ secrets.INVITATION_EXPIRY_DAYS || '7' }}
          EOF

      # Fail the build if any NEXT_PUBLIC_* var the client needs is missing
      # from the build env — a missing var silently disables realtime (no
      # WebSocket ever connects, so messages only appear on load/focus).
      # Check the generated .env.production.local so the guard sits right
      # before next build.
      - name: Verify client build-time env vars
        working-directory: apps/web
        shell: bash
        run: |
          missing=0
          for name in NEXT_PUBLIC_APP_URL NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_REALTIME_URL; do
            value=$(grep "^${name}=" .env.production.local | head -1 | cut -d= -f2-)
            if [ -z "$value" ]; then
              echo "::error::Missing client build-time var: ${name} (absent from .env.production.local)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Client bundle would be built without required NEXT_PUBLIC_* vars, so realtime would be silently disabled. Fix wrangler.toml [vars] or the workflow, then re-run."
            exit 1
          fi

      - name: Build web worker (OpenNext)
        working-directory: apps/web
        env:
          # 2-core GitHub runners can OOM during next build + esbuild bundling.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx opennextjs-cloudflare build

      # Blocking: a type error or a failing unit test must stop the deploy.
      # `next build` already fails on type errors (next.config.js no longer
      # sets typescript.ignoreBuildErrors), but running tsc first reports the
      # file/line instead of a bundler stack trace, and catches errors in
      # files the build tree does not reach.
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: apps/web
        run: |
          npx tsx --tsconfig tsconfig.json --test lib/read-manager.test.ts
          npx tsx --test lib/request-cache.test.ts

      - name: Deploy web worker
        working-directory: apps/web
        # --keep-vars: preserve any vars/secrets set in the Cloudflare
        # dashboard that aren't in .dev.vars (e.g. NEXT_PUBLIC_*).
        run: npx opennextjs-cloudflare deploy -- --keep-vars

