name: Deploy to Cloudflare

# Deploys the web worker (uxcommunity-web) and realtime worker
# (uxcommunity-realtime) on every push to main. Mirrors the manual flow:
#
#   cd apps/web && npm run deploy
#   cd apps/realtime && npx wrangler deploy
#
# Secrets are read from GitHub Actions secrets (Settings → Secrets and
# variables → Actions) and written into .dev.vars, which
# `opennextjs-cloudflare deploy` uploads as Worker secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      # wrangler 4.x requires Node >= 22, so use 22 (LTS) even though the
      # app itself builds fine on Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required secrets are set
        shell: bash
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
            SESSION_SECRET SUPABASE_SERVICE_ROLE_KEY \
            REALTIME_URL REALTIME_PUBLISH_SECRET \
            API_URL API_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REALTIME_URL: ${{ secrets.REALTIME_URL }}
          REALTIME_PUBLISH_SECRET: ${{ secrets.REALTIME_PUBLISH_SECRET }}
          API_URL: ${{ secrets.API_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}

      # A wrong guard here would block a HEALTHY deploy, so its helpers are
      # pinned down before it is allowed to gate one — same rule as the
      # realtime smoke harness below.
      - name: Unit-test the Cloudflare credential guard
        run: node --test scripts/verify-cloudflare-credentials.test.mjs

      # The other credential that decides whether a deploy is worth making:
      # same rule as above, its failure branches are pinned down first.
      - name: Unit-test the R2 media credential guard
        run: node --test scripts/verify-r2-credentials.test.mjs

      - name: Unit-test the service credential guard
        run: node --test scripts/verify-service-credentials.test.mjs

      # Fail in seconds, naming the secret that is wrong, instead of after a
      # full OpenNext build on a symptom from the deepest layer of the stack.
      # On 2026-10-08 the credential stopped being accepted and surfaced here:
      #
      #   Error: Failed to provision remote R2 bucket "uxcommunity-web-next-cache"
      #   for binding "NEXT_INC_CACHE_R2_BUCKET": Failed to check whether bucket
      #   exists: 401 ... Authentication error
      #
      # — the web deploy's R2 check using the same dead token the realtime
      # deploy above had already failed with, on the same run whose sibling job
      # could not even delete a preview worker. The message reads like OpenNext
      # or R2; the cause was the credential. This step asks the credential to
      # prove itself (`/user/tokens/verify` — a rejection there can only be the
      # token), warns when its TTL is inside two weeks, and makes the same
      # bucket read OpenNext makes, so a token that is live but was never given
      # "Workers R2 Storage" also fails here, with the permission named.
      - name: Verify Cloudflare credentials
        run: node scripts/verify-cloudflare-credentials.mjs

      # ── Realtime worker (the web app publishes to it) ─────────────────────
      - name: Deploy realtime worker
        working-directory: apps/realtime
        run: npx wrangler deploy

      # Set AFTER the deploy, and never from the dashboard: `wrangler deploy`
      # replaces the Worker's vars with the ones in its config file, so a
      # plaintext value added by hand in the Cloudflare UI disappears on the
      # next merge. Secrets are exempt from that sweep — wrangler never deletes
      # them on a deploy — but the values still belong here, because taking both
      # Workers' copies from one GitHub secret is what keeps them provably in
      # sync.
      #
      # WHY `secret put` AND NOT `versions secret put` (this is load-bearing):
      # `wrangler versions secret put` stages the value into a NEW version of the
      # Worker and deliberately does NOT deploy it — it exists for gradual
      # rollouts, which this Worker does not use. So every run of this step used
      # to write the four secrets into a version nobody served, leaving the live
      # version on whatever it already had: rotating a GitHub secret silently
      # changed nothing in production, and a Worker that is running without
      # SESSION_SECRET refuses every handshake with a 401 that no log explains
      # (see apps/realtime/src/session-config.ts). `wrangler secret put`
      # publishes the version it creates, which is what this step means.
      #
      # The value is written with `printf '%s'` rather than `echo`, which appends
      # a newline: a secret that arrives with a trailing \n still signs nothing
      # the web app can verify.
      #
      # API_URL / API_SECRET are the membership check's configuration. The
      # realtime Worker FAILS CLOSED without them (audit M-8): with API_URL
      # missing or unreachable, or API_SECRET not matching the web app's, every
      # community socket is refused rather than silently let in. They are
      # therefore verified above and pushed here on every deploy, and API_SECRET
      # is written into the web Worker's .dev.vars below from the same GitHub
      # secret, so the two Workers cannot drift apart.
      - name: Set realtime worker secrets
        working-directory: apps/realtime
        run: |
          printf '%s' "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET
          printf '%s' "${{ secrets.REALTIME_PUBLISH_SECRET }}" | npx wrangler secret put REALTIME_PUBLISH_SECRET
          printf '%s' "${{ secrets.API_URL }}" | npx wrangler secret put API_URL
          printf '%s' "${{ secrets.API_SECRET }}" | npx wrangler secret put API_SECRET

      # The smoke check chooses the origin it probes, mints the session token and
      # picks which secrets to sign with — a mistake there would fail a HEALTHY
      # deploy, so its helpers are pinned down before it is allowed to gate one.
      - name: Unit-test the realtime smoke harness
        run: node --test scripts/smoke-realtime.test.mjs

      # Prove the version just published actually works, BEFORE the web worker
      # ships against it. A deploy that answers `/publish` with "ok" while
      # refusing every WebSocket handshake (a secret that never reached the live
      # version, a broken custom-domain route) used to look like a successful
      # release; this turns it into a red build. Blocks on exit code 1.
      #
      # The target is the SAME origin the client bundle is built against — the
      # value in apps/web/wrangler.toml [vars] — so a route that works for CI but
      # not for browsers cannot pass.
      #
      # API_URL / API_SECRET are passed for the same reason: the smoke test now
      # also proves the MEMBERSHIP endpoint with them, because the socket checks
      # above are all user-scoped and user rooms skip the membership gate. A
      # wrong pair here — an API_URL that is a stale deployment, an API_SECRET
      # the web app does not recognize — refuses every COMMUNITY socket in the
      # product while every other check stays green, which is exactly how this
      # went unnoticed. Both come from the same GitHub secrets the step above
      # pushed, so the failure names the secret that is wrong.
      - name: Smoke-test the deployed realtime worker
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          REALTIME_PUBLISH_SECRET: ${{ secrets.REALTIME_PUBLISH_SECRET }}
          REALTIME_URL: ${{ secrets.REALTIME_URL }}
          API_URL: ${{ secrets.API_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: |
          origin=$(awk -F'"' '/^NEXT_PUBLIC_REALTIME_URL/{print $2}' apps/web/wrangler.toml)
          node scripts/smoke-realtime.mjs --url "${origin:-$REALTIME_URL}"

      # ── Web worker ─────────────────────────────────────────────────────────
      - name: Write build + runtime env files
        working-directory: apps/web
        run: |
          # Build-time env. NEXT_PUBLIC_* vars are INLINED into the client
          # bundle by `next build`, so they must be present in the build
          # environment — wrangler.toml [vars] only reach the worker at
          # runtime (server-side), never the client JS. Mirror them from
          # wrangler.toml into .env.production.local so the client bundle
          # (app URL, realtime WebSocket URL, Supabase project URL) is built
          # with the same values the worker gets at runtime. Supabase is
          # reached only through the server-side service-role client, so
          # there is no anon key to inline.
          cat > .env.production.local <<EOF
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          EOF
          awk '/^\[vars\]/{f=1;next}/^\[/{f=0}f && /^[A-Z_]+ = /{gsub(/^ +/,""); split($0,a," = "); gsub(/"/,"",a[2]); print a[1]"="a[2]}' wrangler.toml >> .env.production.local

          # Runtime secrets → uploaded as Worker secrets by the deploy step.
          # Same values as the local apps/web/.dev.vars.
          cat > .dev.vars <<EOF
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Same value the realtime Worker gets, from the same GitHub secret:
          # the internal membership endpoint only accepts this exact secret.
          API_SECRET=${{ secrets.API_SECRET }}
          REALTIME_URL=${{ secrets.REALTIME_URL }}
          REALTIME_PUBLISH_SECRET=${{ secrets.REALTIME_PUBLISH_SECRET }}
          UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          GIPHY_API_KEY=${{ secrets.GIPHY_API_KEY }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          INVITATION_EXPIRY_DAYS=${{ secrets.INVITATION_EXPIRY_DAYS || '7' }}
          EOF

      # ── The media credential every upload route uses ────────────────────
      # Threads, showcase, events, avatars and chat attachments all write
      # through one S3-compatible client in apps/web/lib/r2.ts, built from
      # R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY — the values written into
      # .dev.vars above and uploaded as Worker secrets below. Nothing used to
      # ask that credential to prove it still worked: on 2026-10-09 a rejected
      # key surfaced hours later as a 500 on the first user upload, and the
      # only trace was `Unauthorized: Unauthorized` inside the AWS SDK stack.
      # This PUTs a probe object, reads it back and deletes it, so a revoked,
      # rolled or wrong-account key fails here in seconds naming the secret.
      # Passed from the repository secrets rather than read back out of
      # .dev.vars, so it proves the value the deploy is about to push.
      - name: Verify R2 media credentials
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: node scripts/verify-r2-credentials.mjs

      # ── The other secrets the deploy is about to push ───────────────────
      # The R2 outage on 2026-10-09 was one credential dying unnoticed. The
      # audit that followed found the same blind spot on every other secret
      # this workflow writes into .dev.vars: the deploy uploads them whether or
      # not they are still accepted, and each failure hides in a different
      # place — Supabase 401s every API route, Resend makes password resets
      # vanish silently, Upstash turns every rate limit OFF (the limiter fails
      # open by design), GIPHY breaks GIF search. Each one now proves itself
      # with a single read-only request before the build. Passed from the
      # repository secrets, not read back out of .dev.vars, so it proves the
      # values this deploy is about to push.
      - name: Verify service credentials
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: |
          # The project URL is not a secret: it is the [vars] value that reaches
          # the Worker, so the probe has to use THAT one (same read as the
          # realtime smoke step above) rather than a copy that could drift.
          export NEXT_PUBLIC_SUPABASE_URL="$(awk -F'"' '/^NEXT_PUBLIC_SUPABASE_URL/{print $2}' apps/web/wrangler.toml)"
          node scripts/verify-service-credentials.mjs

      # Fail the build if any NEXT_PUBLIC_* var the client needs is missing
      # from the build env — a missing var silently disables realtime (no
      # WebSocket ever connects, so messages only appear on load/focus).
      # Check the generated .env.production.local so the guard sits right
      # before next build.
      - name: Verify client build-time env vars
        working-directory: apps/web
        shell: bash
        run: |
          missing=0
          for name in NEXT_PUBLIC_APP_URL NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_REALTIME_URL; do
            value=$(grep "^${name}=" .env.production.local | head -1 | cut -d= -f2-)
            if [ -z "$value" ]; then
              echo "::error::Missing client build-time var: ${name} (absent from .env.production.local)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Client bundle would be built without required NEXT_PUBLIC_* vars, so realtime would be silently disabled. Fix wrangler.toml [vars] or the workflow, then re-run."
            exit 1
          fi

      - name: Build web worker (OpenNext)
        working-directory: apps/web
        env:
          # 2-core GitHub runners can OOM during next build + esbuild bundling.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx opennextjs-cloudflare build

      # Blocking: a type error or a failing unit test must stop the deploy.
      # `next build` already fails on type errors (next.config.js no longer
      # sets typescript.ignoreBuildErrors), but running tsc first reports the
      # file/line instead of a bundler stack trace, and catches errors in
      # files the build tree does not reach.
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: apps/web
        run: |
          npx tsx --tsconfig tsconfig.json --test lib/read-manager.test.ts
          npx tsx --test lib/request-cache.test.ts
          # The browser test's seeder resolves its target BEFORE it writes, so
          # these are the guards that decide what a shared project is allowed to
          # receive (e2e/seed-member.mjs). No database, no browser.
          node --test e2e/seed-member.test.mjs

      - name: Deploy web worker
        working-directory: apps/web
        # --keep-vars: preserve any vars/secrets set in the Cloudflare
        # dashboard that aren't in .dev.vars (e.g. NEXT_PUBLIC_*).
        run: npx opennextjs-cloudflare deploy -- --keep-vars

