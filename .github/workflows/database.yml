name: Database baseline

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/db/**'
      - '.github/workflows/database.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test empty Supabase and compare complete catalogs
        run: |
          python3 scripts/db/test_compare.py
          python3 scripts/db/test_fresh.py --runtime docker
      - name: Upload schema comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-schema-comparison
          path: test-results/schema/
