name: CI

# Quality gate for the web app. Before this workflow the repository had no
# check on types at all: the only CI was the two deploy workflows, and
# `next build` was told to ignore type errors, so a broken type or a failing
# unit test could reach production unnoticed.
#
# Jobs are deliberately separate so a failure names the broken concern.
# TypeScript, the unit tests and the comment audit are blocking; ESLint is
# advisory until the pre-existing ruleset debt is cleared (see the note on the
# lint job).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Production deployment calls this workflow directly (see deploy.yml) so the
  # release gate runs against the exact commit being released. A separate
  # "latest green run on main" lookup could authorize an older commit.
  workflow_call:

permissions:
  contents: read

# Push/PR runs cancel their own superseded run. A workflow_dispatch run (the
# production deployment calls this workflow, and can also be started by hand)
# gets a run-specific group so it can never be cancelled by another dispatch —
# a release must not lose its gate halfway through.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'head' }}
  cancel-in-progress: true

env:
  APP_ENV: production # Existing suites verify production behavior with dummy fixtures.

jobs:
  mobile-chat:
    name: Mobile chat loading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            expo-app-standalone 3/package-lock.json
      - run: npm ci
      - run: npm ci --ignore-scripts
        working-directory: expo-app-standalone 3
      - run: npm run typecheck
        working-directory: expo-app-standalone 3
      - run: npm run test:mobile-chat-open
      - run: node --test "expo-app-standalone 3/tests/chat-keyboard.test.mjs"

  isolation:
    name: Environment isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:environments
      - run: node --test apps/web/e2e/seed-member.test.mjs
      - run: node --test apps/web/e2e/community-bootstrap.test.mjs
      - run: node --test k6/lib/realtime-fanout.test.mjs
      - run: python3 scripts/db/test_guard.py

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking. The generated database types in
      # apps/web/lib/supabase/database.types.ts are what let this pass: without
      # them the SupabaseClient schema generic collapses to `never` and every
      # query in the app fails to type-check.
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking. Runs the whole web unit suite; build output is pruned so a
      # stale `next build` in the workspace cannot add or hide tests. The
      # extension list is explicit so a .tsx/.js/.mjs unit test cannot be
      # silently missed. The e2e directory is pruned on purpose: those suites
      # need a browser, a running app, or Supabase; the pure ones run in the
      # isolation job and the rest are staging/device checks.
      - name: Run unit tests
        working-directory: apps/web
        run: |
          FILES=$(find . \( -name node_modules -o -name .next -o -name .open-next -o -name e2e \) -prune -o \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.test.mjs' -o -name '*.test.js' -o -name '*.test.jsx' \) -print | sort)
          echo "running $(( $(echo "$FILES" | wc -l) )) test files"
          npx tsx --tsconfig tsconfig.json --test $FILES

      # Blocking. The mobile app is not an npm workspace, so its suites are not
      # picked up by the glob above. These cover the realtime lifecycle
      # (reconnect catch-up, logout cleanup, account switch, user-room keying)
      # and import nothing from React Native, so they run on the runner as-is.
      - name: Run mobile realtime tests
        run: npm run test:mobile-realtime

      # Blocking. Same reason as above: the bounded sender-name cache lives in
      # the mobile app, which the web glob cannot see.
      - name: Run mobile lib tests
        run: npm run test:mobile-cache

      # Blocking. Session teardown, push presentation and the Android backup
      # policy are security boundaries; each is a React-Native-free module or
      # a config assertion, so it runs on the runner as-is.
      - name: Run mobile security tests
        run: npm run test:mobile-security

      # Blocking. Same reason again: the chat content-card helpers live in the
      # mobile app. The card's text is ported from the web byte-for-byte, so
      # drift here is a real cross-client regression.
      - name: Run mobile chat content tests
        run: npm run test:mobile-chat-content

      # Blocking. Chat media geometry decides the box an image bubble reserves
      # before its bytes arrive; a regression there is a visible jump on both
      # clients. Covers the web ratio/size cache and the mobile frame, so the
      # two stay in step.
      - name: Run chat media tests
        run: npm run test:chat-media

      # Blocking. The Home feed's two tabs (Public Posts / Your Communities)
      # ship in the mobile app, and the stored choice decides which one opens.
      # The axis lives in a React-Native-free module, so it runs here like the
      # suites above.
      - name: Run mobile home feed scope tests
        run: npm run test:mobile-home-feed

      # Blocking. The card ··· menu's parity work (report reasons/API types,
      # join outcomes, moderation grants) lives in React-Native-free modules,
      # so it runs here like the suites above.
      - name: Run mobile content action tests
        run: npm run test:mobile-content-actions

      # Blocking. The smoke harness is the last gate before a production
      # deploy, and it imports the same ws/jose stack as the realtime suites.
      # It needs an installed tree, so it runs here rather than in the
      # dependency-free deployment audit job.
      - name: Unit-test the realtime smoke harness
        run: node --test scripts/smoke-realtime.test.mjs

      # Blocking. Push registration decides whether a member's device receives
      # anything at all, and its failure modes are silent: a token echo that
      # re-posts forever, a skipped post that leaves the settings screen on
      # "registering", a request with no deadline that blocks every retry. The
      # state machine, the settlement rule and the deadline helper import no
      # React Native, so they run here like the suites above.
      - name: Run mobile push tests
        run: npm run test:mobile-push

  realtime:
    name: Realtime correctness
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The Worker reads APP_ENV from the isolated .dev.vars fixture; this
      # process-level value keeps any test helper that reads process.env on the
      # same local-development path. No production service is contacted.
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suites read .dev.vars (SESSION_SECRET, REALTIME_PUBLISH_SECRET and
      # the membership API coordinates). The committed fixture holds disposable
      # CI-only values and nothing from production; the vitest global setup
      # rewrites API_URL to a local membership stub and restores the file on
      # teardown. The Workers themselves are miniflare instances in this job —
      # no Cloudflare account or deployed resource is touched.
      - name: Create the isolated realtime test environment
        run: cp apps/realtime/__tests__/fixtures/ci.vars apps/realtime/.dev.vars

      - name: Type check
        run: npm run typecheck --workspace=apps/realtime

      # Blocking. Covers the WebSocket lifecycle, UserDO/CommunityDO routing,
      # DO-to-DO RPC delivery, multi-client fan-out, membership authorization,
      # revocation, reconnect/disconnect behaviour and concurrency. The
      # socket-heavy load suites are excluded here and run from the manual
      # "Realtime load tests" workflow instead.
      - name: Run realtime correctness tests
        run: npm run test:realtime --workspace=apps/realtime

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking. `next build` also enforces the type checker (next.config.js
      # does not ignore build errors) and catches bundling/route problems that
      # tsc alone cannot. The values are obvious CI dummies: no request leaves
      # the runner during the build and no production service is contacted.
      - name: Build the web app
        working-directory: apps/web
        env:
          APP_ENV: production
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_APP_URL: https://ci.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
          NEXT_PUBLIC_REALTIME_URL: https://ci.invalid
          REALTIME_URL: https://ci.invalid
          R2_PUBLIC_URL: https://ci.invalid
          SESSION_SECRET: ci-build-session-secret
          API_SECRET: ci-build-api-secret
          REALTIME_PUBLISH_SECRET: ci-build-publish-secret
          SUPABASE_SERVICE_ROLE_KEY: ci-build-service-role-key
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

  comments:
    name: Comment audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No install step: the audit reads tracked files with Node builtins only,
      # so it costs a few seconds and cannot be blocked by a dependency problem.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Blocking. Comments are the one artefact nothing else checks: a moved
      # file, a renamed symbol, or a doc block left above the wrong helper is
      # invisible to tsc and to ESLint. Every rule is provable against the
      # working tree, so a failure is always real. Exemptions live in
      # scripts/comment-audit.allow.json and must carry a reason.
      - name: Audit comments
        run: node scripts/audit-comments.mjs

  deployment:
    name: Deployment targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No install step: the audit reads tracked files with git + Node builtins
      # only, so it costs a few seconds and cannot be blocked by a dependency
      # problem.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Blocking. The app deploys only to Cloudflare Workers. A reintroduced
      # vercel.json, @vercel/* package, Vercel CLI step or vercel.app URL would
      # quietly create a second deployment target no workflow maintains.
      - name: Audit Vercel drift
        run: node scripts/audit-vercel.mjs

      # Blocking, and no install step for the same reason as the audits above.
      # The credential guard decides whether both deploy workflows proceed, and
      # its failure branches — a rejected or expired token, an R2 bucket the
      # token cannot read — are exercised here, where a mistake in the guard
      # cannot block a release.
      - name: Unit-test the Cloudflare credential guard
        run: node --test scripts/verify-cloudflare-credentials.test.mjs

      # Same rule, same job, same reason: the R2 media credential guard decides
      # whether the deploy proceeds, so a mistake in it must be caught where it
      # cannot block a release. It reads no files and imports no packages, so it
      # runs here without an install step like the two audits above.
      - name: Unit-test the R2 media credential guard
        run: node --test scripts/verify-r2-credentials.test.mjs

      # Same rule again: the FCM guard decides whether a deploy proceeds, and
      # a dead push key does not fail anything — it silently turns every
      # Android chat notification back into the generic app icon. A mistake in
      # the guard has to be caught here, not while releasing.
      - name: Unit-test the FCM credential guard
        run: node --test scripts/verify-fcm-credentials.test.mjs

      # The service credential guard gates every production release too. It is
      # exercised on every PR here, before the deployment workflow calls this
      # suite, so a broken guard cannot be discovered only at release time.
      - name: Unit-test the service credential guard
        run: node --test scripts/verify-service-credentials.test.mjs

      # The deploy job's SHA guard decides whether a queued release publishes
      # at all. Its accepted, moved-main and wrong-checkout branches run here
      # against disposable git repositories.
      - name: Unit-test the release commit guard
        run: node --test scripts/verify-release-commit.test.mjs

      # Static assertions over the deploy/CI/staging workflows: the reusable
      # CI dependency, exact-SHA checkout, stale-main guard, approval
      # environment and concurrency isolation. This is structural validation,
      # not an end-to-end production run.
      - name: Audit the release workflow structure
        run: node --test scripts/release-workflow.test.mjs

  lint:
    name: ESLint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Advisory, not blocking. The repository has 43 pre-existing source
      # errors from rules that arrived with `eslint-plugin-react-hooks` v6,
      # pulled in by `eslint-config-next: "latest"`:
      #   react-hooks/set-state-in-effect (28), react/no-unescaped-entities (6),
      #   react-hooks/refs (5), react-hooks/immutability (4)
      # They are unrelated to the change this gate was added for, and fixing
      # them means restructuring React effects across ~30 components, so they
      # belong in a dedicated cleanup. Flip `continue-on-error` to false (and
      # pin eslint-config-next to a fixed version) once that lands.
      - name: Lint
        working-directory: apps/web
        continue-on-error: true
        env:
          # eslint on this tree needs more heap than the default on a 2-core
          # runner, or it crashes instead of reporting.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx eslint .
