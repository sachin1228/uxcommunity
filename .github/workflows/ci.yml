name: CI

# Quality gate for the web app. Before this workflow the repository had no
# check on types at all: the only CI was the two deploy workflows, and
# `next build` was told to ignore type errors, so a broken type or a failing
# unit test could reach production unnoticed.
#
# Jobs are deliberately separate so a failure names the broken concern.
# TypeScript, the unit tests and the comment audit are blocking; ESLint is
# advisory until the pre-existing ruleset debt is cleared (see the note on the
# lint job).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: production # Existing suites verify production behavior with dummy fixtures.

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking. The generated database types in
      # apps/web/lib/supabase/database.types.ts are what let this pass: without
      # them the SupabaseClient schema generic collapses to `never` and every
      # query in the app fails to type-check.
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking. Runs the whole web unit suite; build output is pruned so a
      # stale `next build` in the workspace cannot add or hide tests.
      - name: Run unit tests
        working-directory: apps/web
        run: |
          FILES=$(find . \( -name node_modules -o -name .next -o -name .open-next \) -prune -o -name '*.test.ts' -print | sort)
          echo "running $(( $(echo "$FILES" | wc -l) )) test files"
          npx tsx --tsconfig tsconfig.json --test $FILES

      # Blocking. The mobile app is not an npm workspace, so its suites are not
      # picked up by the glob above. These cover the realtime lifecycle
      # (reconnect catch-up, logout cleanup, account switch, user-room keying)
      # and import nothing from React Native, so they run on the runner as-is.
      - name: Run mobile realtime tests
        run: npm run test:mobile-realtime

      # Blocking. Same reason as above: the bounded sender-name cache lives in
      # the mobile app, which the web glob cannot see.
      - name: Run mobile lib tests
        run: npm run test:mobile-cache

      # Blocking. Same reason again: the chat content-card helpers live in the
      # mobile app. The card's text is ported from the web byte-for-byte, so
      # drift here is a real cross-client regression.
      - name: Run mobile chat content tests
        run: npm run test:mobile-chat-content

      # Blocking. Chat media geometry decides the box an image bubble reserves
      # before its bytes arrive; a regression there is a visible jump on both
      # clients. Covers the web ratio/size cache and the mobile frame, so the
      # two stay in step.
      - name: Run chat media tests
        run: npm run test:chat-media

      # Blocking. The Home feed's two tabs (Public Posts / Your Communities)
      # ship in the mobile app, and the stored choice decides which one opens.
      # The axis lives in a React-Native-free module, so it runs here like the
      # suites above.
      - name: Run mobile home feed scope tests
        run: npm run test:mobile-home-feed

      # Blocking. The card ··· menu's parity work (report reasons/API types,
      # join outcomes, moderation grants) lives in React-Native-free modules,
      # so it runs here like the suites above.
      - name: Run mobile content action tests
        run: npm run test:mobile-content-actions

      # Blocking. Push registration decides whether a member's device receives
      # anything at all, and its failure modes are silent: a token echo that
      # re-posts forever, a skipped post that leaves the settings screen on
      # "registering", a request with no deadline that blocks every retry. The
      # state machine, the settlement rule and the deadline helper import no
      # React Native, so they run here like the suites above.
      - name: Run mobile push tests
        run: npm run test:mobile-push

  comments:
    name: Comment audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No install step: the audit reads tracked files with Node builtins only,
      # so it costs a few seconds and cannot be blocked by a dependency problem.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Blocking. Comments are the one artefact nothing else checks: a moved
      # file, a renamed symbol, or a doc block left above the wrong helper is
      # invisible to tsc and to ESLint. Every rule is provable against the
      # working tree, so a failure is always real. Exemptions live in
      # scripts/comment-audit.allow.json and must carry a reason.
      - name: Audit comments
        run: node scripts/audit-comments.mjs

  deployment:
    name: Deployment targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No install step: the audit reads tracked files with git + Node builtins
      # only, so it costs a few seconds and cannot be blocked by a dependency
      # problem.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Blocking. The app deploys only to Cloudflare Workers. A reintroduced
      # vercel.json, @vercel/* package, Vercel CLI step or vercel.app URL would
      # quietly create a second deployment target no workflow maintains.
      - name: Audit Vercel drift
        run: node scripts/audit-vercel.mjs

      # Blocking, and no install step for the same reason as the audits above.
      # The credential guard decides whether both deploy workflows proceed, and
      # its failure branches — a rejected or expired token, an R2 bucket the
      # token cannot read — are exercised here, where a mistake in the guard
      # cannot block a release.
      - name: Unit-test the Cloudflare credential guard
        run: node --test scripts/verify-cloudflare-credentials.test.mjs

      # Same rule, same job, same reason: the R2 media credential guard decides
      # whether the deploy proceeds, so a mistake in it must be caught where it
      # cannot block a release. It reads no files and imports no packages, so it
      # runs here without an install step like the two audits above.
      - name: Unit-test the R2 media credential guard
        run: node --test scripts/verify-r2-credentials.test.mjs

      # Same rule again: the FCM guard decides whether a deploy proceeds, and
      # a dead push key does not fail anything — it silently turns every
      # Android chat notification back into the generic app icon. A mistake in
      # the guard has to be caught here, not while releasing.
      - name: Unit-test the FCM credential guard
        run: node --test scripts/verify-fcm-credentials.test.mjs

  lint:
    name: ESLint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Advisory, not blocking. The repository has 43 pre-existing source
      # errors from rules that arrived with `eslint-plugin-react-hooks` v6,
      # pulled in by `eslint-config-next: "latest"`:
      #   react-hooks/set-state-in-effect (28), react/no-unescaped-entities (6),
      #   react-hooks/refs (5), react-hooks/immutability (4)
      # They are unrelated to the change this gate was added for, and fixing
      # them means restructuring React effects across ~30 components, so they
      # belong in a dedicated cleanup. Flip `continue-on-error` to false (and
      # pin eslint-config-next to a fixed version) once that lands.
      - name: Lint
        working-directory: apps/web
        continue-on-error: true
        env:
          # eslint on this tree needs more heap than the default on a 2-core
          # runner, or it crashes instead of reporting.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx eslint .
