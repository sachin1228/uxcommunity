name: Deploy isolated staging
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy staging, benchmark it, or compare a baseline with the current revision
        type: choice
        options: [deploy, benchmark, compare]
        default: deploy
        required: true
      baseline_ref:
        description: Exact pre-fix commit SHA for compare mode (staging is restored afterward)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/main' && inputs.mode != 'benchmark' && inputs.mode != 'compare'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate and test isolation
        run: npm run test:environments
      - name: Prepare private staging manifest
        env:
          STAGING_CONFIGURATION: ${{ secrets.STAGING_CONFIGURATION }}
        run: |
          umask 077
          mkdir -p .local/staging
          printf '%s' "$STAGING_CONFIGURATION" > .local/staging/environment.json

      # Same order as production: migrate first, then deploy the code that
      # expects the new schema. The wrapper refuses the production project, so
      # this can only touch the independent staging database.
      - name: Verify staging database secrets are set
        shell: bash
        env:
          STAGING_DATABASE_PASSWORD: ${{ secrets.STAGING_DATABASE_PASSWORD }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          for name in STAGING_DATABASE_PASSWORD STAGING_SUPABASE_ACCESS_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing staging environment secret: $name"
              exit 1
            fi
          done

      - name: Plan staging database migrations
        env:
          STAGING_DATABASE_PASSWORD: ${{ secrets.STAGING_DATABASE_PASSWORD }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: node --import tsx scripts/environments/staging-db.mjs plan

      - name: Apply staging database migrations
        env:
          STAGING_DATABASE_PASSWORD: ${{ secrets.STAGING_DATABASE_PASSWORD }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: node --import tsx scripts/environments/staging-db.mjs migrate

      - name: Deploy staging only
        env:
          CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_STAGING_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
        run: node --import tsx scripts/environments/staging.mjs deploy

  chat-open-benchmark:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'benchmark' || inputs.mode == 'compare')
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare private staging manifest
        env:
          STAGING_CONFIGURATION: ${{ secrets.STAGING_CONFIGURATION }}
        run: |
          umask 077
          mkdir -p .local/staging
          printf '%s' "$STAGING_CONFIGURATION" > .local/staging/environment.json
      - name: Seed idempotent staging fixture
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { seedFixtures } from './scripts/environments/fixtures.mjs';
          const env = JSON.parse(await readFile('.local/staging/environment.json', 'utf8'));
          if (env.APP_ENV !== 'staging') throw new Error('Refusing fixture writes outside staging');
          await seedFixtures(env);
          NODE
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare benchmark environment
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFile, readFile } from 'node:fs/promises';
          import bcrypt from 'bcryptjs';
          import { createClient } from '@supabase/supabase-js';
          const env = JSON.parse(await readFile('.local/staging/environment.json', 'utf8'));
          if (env.APP_ENV !== 'staging' || !env.NEXT_PUBLIC_APP_URL.includes('staging')) {
            throw new Error('Refusing to benchmark an unverified staging target');
          }
          const password = randomBytes(32).toString('base64url');
          console.log(`::add-mask::${password}`);
          const db = createClient(env.NEXT_PUBLIC_SUPABASE_URL, env.SUPABASE_SERVICE_ROLE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
          });
          const email = 'designer@staging.invalid';
          const { data: user, error: findError } = await db.from('users').select('id').eq('email', email).single();
          if (findError) throw findError;
          const { error: updateError } = await db.from('users')
            .update({ password_hash: await bcrypt.hash(password, 12) }).eq('id', user.id);
          if (updateError) throw updateError;
          await appendFile(process.env.GITHUB_ENV, [
            `E2E_APP_URL=${env.NEXT_PUBLIC_APP_URL}`,
            `E2E_EMAIL=${email}`,
            `E2E_PASSWORD=${password}`,
            'E2E_COMMUNITY_ID=de000000-0000-4000-8000-000000000001',
            'E2E_SAMPLES=10',
            'E2E_CHAT_TIMING_OUT=.local/staging/chat-open-timing.json',
            '',
          ].join('\n'), { mode: 0o600 });
          NODE
      - name: Prepare pre-fix staging worktree
        if: inputs.mode == 'compare'
        env:
          BENCHMARK_BASELINE_REF: ${{ inputs.baseline_ref }}
        run: node scripts/environments/chat-baseline.mjs
      - name: Install baseline dependencies
        if: inputs.mode == 'compare'
        working-directory: .local/staging/chat-baseline
        run: npm ci
      - name: Deploy baseline to staging
        if: inputs.mode == 'compare'
        env:
          CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_STAGING_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
        working-directory: .local/staging/chat-baseline
        run: node --import tsx scripts/environments/staging.mjs deploy
      - name: Measure before
        id: before
        if: inputs.mode == 'compare'
        env:
          E2E_CHAT_TIMING_OUT: .local/staging/chat-open-before.json
          E2E_TARGET_SHA: ${{ inputs.baseline_ref }}
        run: npm run bench:community-chat-open
      - name: Restore merged staging revision
        id: restore
        if: always() && inputs.mode == 'compare'
        env:
          CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_STAGING_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
        run: node --import tsx scripts/environments/staging.mjs deploy
      - name: Measure after
        if: inputs.mode == 'compare' && steps.before.outcome == 'success' && steps.restore.outcome == 'success'
        env:
          E2E_CHAT_TIMING_OUT: .local/staging/chat-open-after.json
          E2E_TARGET_SHA: ${{ github.sha }}
        run: npm run bench:community-chat-open
      - name: Measure community chat opening time
        if: inputs.mode == 'benchmark'
        env:
          E2E_TARGET_SHA: ${{ github.sha }}
        run: npm run bench:community-chat-open
      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-community-chat-open-timing
          path: .local/staging/chat-open-*.json
          if-no-files-found: ignore
