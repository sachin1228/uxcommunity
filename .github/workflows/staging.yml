name: Deploy isolated staging
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate and test isolation
        run: npm run test:environments
      - name: Prepare private staging manifest
        env:
          STAGING_CONFIGURATION: ${{ secrets.STAGING_CONFIGURATION }}
        run: |
          umask 077
          mkdir -p .local/staging
          printf '%s' "$STAGING_CONFIGURATION" > .local/staging/environment.json

      # Same order as production: migrate first, then deploy the code that
      # expects the new schema. The wrapper refuses the production project, so
      # this can only touch the independent staging database.
      - name: Verify staging database secrets are set
        shell: bash
        env:
          STAGING_DATABASE_PASSWORD: ${{ secrets.STAGING_DATABASE_PASSWORD }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: |
          for name in STAGING_DATABASE_PASSWORD STAGING_SUPABASE_ACCESS_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing staging environment secret: $name"
              exit 1
            fi
          done

      - name: Plan staging database migrations
        env:
          STAGING_DATABASE_PASSWORD: ${{ secrets.STAGING_DATABASE_PASSWORD }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: node --import tsx scripts/environments/staging-db.mjs plan

      - name: Apply staging database migrations
        env:
          STAGING_DATABASE_PASSWORD: ${{ secrets.STAGING_DATABASE_PASSWORD }}
          STAGING_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
        run: node --import tsx scripts/environments/staging-db.mjs migrate

      - name: Deploy staging only
        env:
          CLOUDFLARE_STAGING_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_STAGING_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
        run: node --import tsx scripts/environments/staging.mjs deploy
